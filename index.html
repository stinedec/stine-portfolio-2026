<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Vue 3 + Vite starter template" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Portfolio</title>

    <!--
      Google Fonts
      1. Pick fonts at https://fonts.google.com, click "Get embed code" and copy the
         <link> URL (keep "&display=swap" at the end so text shows while fonts load).
      2. Uncomment the three lines below and paste your URL into the last one.
      3. Set the font names in src/assets/styles/tokens.css (--font-sans, --font-heading).
    -->
    <!--
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    -->

    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem('theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch {
        /* storage unavailable */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
